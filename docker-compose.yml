services:
  # S3-compatible object storage for local development and CI. Speaks the
  # same S3 API real AWS does, so src/infrastructure/storage/storage.service.js
  # exercises the exact code path a real bucket will use later -- switching
  # to the partner's own AWS account is only ever an env change (S3_ENDPOINT,
  # S3_BUCKET, credentials), never a code change. See .env.example.
  minio:
    # quay.io, not Docker Hub: MinIO removed minio/minio and minio/mc from
    # Docker Hub, so `docker compose up` on a machine without a cached layer
    # fails with "pull access denied ... repository does not exist". quay.io
    # is where MinIO publishes these images now.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the bucket on first startup and exits -- `docker compose up` alone
  # is enough, no manual console step needed before running anything against
  # STORAGE_PROVIDER=s3.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tennis-explore-assets
      "

  # TENISE-63: local stand-in for the one DynamoDB table the partner has
  # granted (tennis-explore-g2). -inMemory means data resets every
  # `docker compose down`, which is what every test in this repo wants --
  # nothing here depends on data surviving a restart. Switching to the real
  # partner table later is purely an env change (DYNAMODB_ENDPOINT,
  # DYNAMODB_TABLE_NAME, credentials) -- see .env.example and
  # docs/DYNAMODB-MIGRATION.md.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      # Host side is 8800, not DynamoDB Local's usual 8000: 8000 is a common
      # port for other local dev servers (Django, etc.) to already hold on a
      # dev machine, and a host-side collision there is silent -- Docker's
      # own port forward loses to whatever else is already bound to
      # 127.0.0.1:8000, so requests from outside the compose network (this
      # app, `npm run dynamodb:init`, the test suite) quietly hit the wrong
      # server instead of failing loudly. Only the host mapping changes;
      # other containers on this compose network still reach it at
      # dynamodb-local:8000.
      - "8800:8000" # DynamoDB API
    healthcheck:
      # The image ships no curl/wget, so this proves the port is accepting
      # connections with nothing more than bash, which the image does have.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the single table (and enables its TTL attribute) on first
  # startup and exits, the same role minio-init plays for the S3 bucket.
  # Runs bin/dynamodb-init.js straight from the repo -- that script only
  # touches @aws-sdk/client-dynamodb (pure JS, no native bindings), so a
  # Linux container can run it against node_modules installed on any host
  # OS without a rebuild.
  dynamodb-local-init:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-tennis-explore-g2}
      DYNAMODB_PK_NAME: ${DYNAMODB_PK_NAME:-primary_key}
      DYNAMODB_SK_NAME: ${DYNAMODB_SK_NAME:-sort_key}
      DYNAMODB_TTL_ATTRIBUTE: ${DYNAMODB_TTL_ATTRIBUTE:-ttl}
      DYNAMODB_REGION: ${DYNAMODB_REGION:-ap-southeast-2}
      DYNAMODB_ACCESS_KEY_ID: local
      DYNAMODB_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_healthy
    entrypoint: ["node", "bin/dynamodb-init.js"]

volumes:
  minio-data:
