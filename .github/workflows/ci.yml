name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # test/integration/s3Upload.test.js needs an S3-compatible server, same
      # as local dev (docker-compose.yml runs this same image there). Started
      # as a plain container rather than a `services:` entry because GitHub
      # Actions' services schema has no field for a container command, and
      # minio/minio requires one ("server /data") -- it isn't a "run with no
      # args" image the way most service containers (databases, caches) are.
      # bitnami/minio used to be the standard workaround for that (it starts
      # itself from env vars, no command needed), but Broadcom discontinued
      # bitnami/minio:latest on Docker Hub in 2025, so this runs the real
      # image directly instead, with its command spelled out explicitly.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"

          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done

          echo "MinIO did not become healthy in time" >&2
          docker logs minio
          exit 1

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/tennis-explore-assets
          "

      - name: Run integration tests
        env:
          # src/config/env.js requires PORT at import time; the value itself
          # is unused here (telemetryHttpRoute.test.js binds its server to
          # port 0), but a missing PORT throws before the test's own
          # MONGODB_URI skip guard can apply, which hangs the whole file
          # until the runner times it out rather than failing fast.
          PORT: 3000
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_BUCKET: tennis-explore-assets
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: npm run test:integration
