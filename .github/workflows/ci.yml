name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # TEMPORARY — remove once the MONGODB_URI secret is confirmed well-formed.
      # MongoParseError: "Invalid scheme, expected connection string to start
      # with mongodb:// or mongodb+srv://" has repeated across two secret
      # edits. This checks shape only (length, prefix, stray whitespace/quotes)
      # so nothing secret is ever printed, even redacted.
      - name: Debug MONGODB_URI shape
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node -e '
            const v = process.env.MONGODB_URI || "";
            console.log("length:", v.length);
            console.log("startsWithMongodbSrv:", v.startsWith("mongodb+srv://"));
            console.log("startsWithMongodb:", v.startsWith("mongodb://"));
            console.log("startsWithKeyPrefix (MONGODB_URI=):", v.startsWith("MONGODB_URI="));
            console.log("startsWithQuote:", v.startsWith("\"") || v.startsWith("\x27"));
            console.log("endsWithQuote:", v.endsWith("\"") || v.endsWith("\x27"));
            console.log("hasLeadingWhitespace:", /^\s/.test(v));
            console.log("hasTrailingWhitespace:", /\s$/.test(v));
            console.log("hasNewline:", v.includes("\n"));
            console.log("first10CharsRedacted:", v.slice(0, 10).replace(/./g, "*"));
          '

      - name: Run integration tests
        env:
          # src/config/env.js requires PORT at import time; the value itself
          # is unused here (telemetryHttpRoute.test.js binds its server to
          # port 0), but a missing PORT throws before the test's own
          # MONGODB_URI skip guard can apply, which hangs the whole file
          # until the runner times it out rather than failing fast.
          PORT: 3000
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: npm run test:integration
