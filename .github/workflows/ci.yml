name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit


  integration-tests:
    runs-on: ubuntu-latest

    needs:
      - unit-tests

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci


      # The integration S3 upload tests need an S3-compatible endpoint.
      #
      # The previous CI workflow pulled MinIO from quay.io. That external
      # registry dependency can fail before the integration tests even begin.
      #
      # For CI, use a pinned MinIO community binary directly instead. This
      # keeps the test environment deterministic and avoids depending on a
      # container registry purely to provide the temporary S3 emulator.
      - name: Start MinIO
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin

        run: |
          curl -fsSL \
            "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2025-09-07T16-13-09Z" \
            -o /tmp/minio

          chmod +x /tmp/minio

          mkdir -p /tmp/minio-data

          nohup /tmp/minio server /tmp/minio-data \
            --address ":9000" \
            --console-address ":9001" \
            > /tmp/minio.log 2>&1 &

          echo "Waiting for MinIO..."

          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:9000/minio/health/live \
              > /dev/null; then

              echo "MinIO is ready."
              exit 0
            fi

            sleep 1
          done

          echo "MinIO failed to start."

          cat /tmp/minio.log

          exit 1


      # Create the test bucket through the AWS SDK already installed by the
      # project. This avoids pulling the separate quay.io/minio/mc image.
      - name: Create MinIO bucket
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: tennis-explore-assets
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin

        run: |
          node --input-type=module <<'NODE'
          import {
            CreateBucketCommand,
            HeadBucketCommand,
            S3Client,
          } from "@aws-sdk/client-s3";


          const endpoint =
            process.env.S3_TEST_ENDPOINT;

          const bucket =
            process.env.S3_TEST_BUCKET;


          const client =
            new S3Client({
              region:
                "us-east-1",

              endpoint,

              forcePathStyle:
                true,

              credentials: {
                accessKeyId:
                  process.env.S3_ACCESS_KEY_ID,

                secretAccessKey:
                  process.env.S3_SECRET_ACCESS_KEY,
              },
            });


          try {
            await client.send(
              new HeadBucketCommand({
                Bucket:
                  bucket,
              }),
            );

            console.log(
              `Bucket already exists: ${bucket}`,
            );
          } catch {
            await client.send(
              new CreateBucketCommand({
                Bucket:
                  bucket,
              }),
            );

            console.log(
              `Created bucket: ${bucket}`,
            );
          }
          NODE


      - name: Run integration tests
        env:
          # src/config/env.js requires PORT at import time. The integration
          # tests do not use this port directly, but config validation occurs
          # before some test-level skip guards.
          PORT: 3000

          MONGODB_URI: ${{ secrets.MONGODB_URI }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: tennis-explore-assets
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin

        run: npm run test:integration


      # Always print the MinIO log if the job fails. This makes future CI
      # failures much easier to distinguish from application/test failures.
      - name: Show MinIO log on failure
        if: failure()

        run: |
          echo "----- MinIO log -----"

          if [ -f /tmp/minio.log ]; then
            cat /tmp/minio.log
          else
            echo "No MinIO log was created."
          fi