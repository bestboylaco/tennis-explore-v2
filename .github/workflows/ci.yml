name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit


  integration-tests:
    runs-on: ubuntu-latest

    needs:
      - unit-tests

    # Integration tests are deliberately heavier than unit tests.
    #
    # Run them:
    # - manually through workflow_dispatch, or
    # - automatically after a push reaches main.
    #
    # A normal feature-branch push therefore runs unit tests only.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"


      - name: Install dependencies
        run: npm ci


      # ---------------------------------------------------------------------
      # MinIO
      #
      # test/integration/s3Upload.test.js needs an S3-compatible endpoint.
      #
      # The project previously used quay.io/minio/minio, but relying on the
      # container registry caused CI to fail before the integration tests even
      # started.
      #
      # dl.min.io subsequently stopped serving the old community binary URL
      # reliably and can return HTTP 410.
      #
      # Use a pinned GitHub Release asset instead. This is the last MinIO
      # Community release containing the required pre-built Linux amd64 binary.
      # ---------------------------------------------------------------------
      - name: Start MinIO
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin

        run: |
          set -euo pipefail

          MINIO_VERSION="RELEASE.2025-09-07T16-13-09Z"

          echo "Downloading MinIO ${MINIO_VERSION}..."

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/minio \
            "https://github.com/minio/minio/releases/download/${MINIO_VERSION}/minio.linux-amd64.${MINIO_VERSION}"

          chmod +x /tmp/minio


          echo "Installed MinIO version:"

          /tmp/minio --version


          mkdir -p /tmp/minio-data


          echo "Starting MinIO..."

          nohup /tmp/minio server /tmp/minio-data \
            --address ":9000" \
            --console-address ":9001" \
            > /tmp/minio.log 2>&1 &


          echo "Waiting for MinIO health endpoint..."


          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:9000/minio/health/live \
              > /dev/null; then

              echo "MinIO is ready."
              exit 0
            fi

            echo "MinIO not ready yet (${i}/30)..."

            sleep 1
          done


          echo "MinIO failed to become ready."

          echo "----- MinIO log -----"

          cat /tmp/minio.log || true

          exit 1


      # ---------------------------------------------------------------------
      # Create the S3 bucket used by the integration tests.
      #
      # Do this through @aws-sdk/client-s3, which is already installed by
      # npm ci. This avoids depending on the separate quay.io/minio/mc image.
      # ---------------------------------------------------------------------
      - name: Create MinIO bucket
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: tennis-explore-assets

          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin

        run: |
          node --input-type=module <<'NODE'
          import {
            CreateBucketCommand,
            HeadBucketCommand,
            S3Client,
          } from "@aws-sdk/client-s3";


          const endpoint =
            process.env.S3_TEST_ENDPOINT;


          const bucket =
            process.env.S3_TEST_BUCKET;


          const client =
            new S3Client({
              region:
                "us-east-1",

              endpoint,

              forcePathStyle:
                true,

              credentials: {
                accessKeyId:
                  process.env.S3_ACCESS_KEY_ID,

                secretAccessKey:
                  process.env.S3_SECRET_ACCESS_KEY,
              },
            });


          try {
            await client.send(
              new HeadBucketCommand({
                Bucket:
                  bucket,
              }),
            );


            console.log(
              `Bucket already exists: ${bucket}`,
            );
          } catch {
            await client.send(
              new CreateBucketCommand({
                Bucket:
                  bucket,
              }),
            );


            console.log(
              `Created bucket: ${bucket}`,
            );
          }


          await client.send(
            new HeadBucketCommand({
              Bucket:
                bucket,
            }),
          );


          console.log(
            `Bucket is ready: ${bucket}`,
          );
          NODE


      # ---------------------------------------------------------------------
      # Integration tests
      # ---------------------------------------------------------------------
      - name: Run integration tests
        env:
          # src/config/env.js validates PORT during import.
          #
          # The integration tests do not need to bind the application itself
          # to this port, but PORT must exist so configuration can load.
          PORT: 3000


          # MongoDB Atlas integration-test connection.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}


          # Existing project/AWS credentials, required by integration tests
          # that exercise AWS-backed code paths.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          AWS_REGION: ${{ secrets.AWS_REGION }}


          # Local S3-compatible MinIO endpoint used specifically by the upload
          # integration tests.
          S3_TEST_ENDPOINT: http://127.0.0.1:9000

          S3_TEST_BUCKET: tennis-explore-assets

          S3_ACCESS_KEY_ID: minioadmin

          S3_SECRET_ACCESS_KEY: minioadmin

        run: npm run test:integration


      # ---------------------------------------------------------------------
      # Diagnostics
      #
      # If anything after MinIO startup fails, keep its server log visible in
      # the GitHub Actions output. This makes it clear whether the problem is
      # MinIO itself or an actual integration-test/application failure.
      # ---------------------------------------------------------------------
      - name: Show MinIO log on failure
        if: failure()

        run: |
          echo "----- MinIO log -----"

          if [ -f /tmp/minio.log ]; then
            cat /tmp/minio.log
          else
            echo "No MinIO log was created."
          fi