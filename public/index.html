<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TennisExplore</title>
    <meta name="description"
          content="The central repository for Tennis Australia performance data, research and coaching knowledge.">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/site.css">
</head>
<body>
    <div class="site">
        <!--
            One header, repeated across the three pages. Kept as plain markup
            rather than injected by script so the pages still make sense with
            JavaScript disabled, and so there is nothing to go wrong before the
            first paint.
        -->
        <header class="site-header">
            <a class="brand" href="/">
                <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="11" fill="none"
                            stroke="var(--colour-green)" stroke-width="2"/>
                    <path d="M4 6c6 3 10 7 16 12" fill="none"
                          stroke="var(--colour-green)" stroke-width="2"/>
                </svg>
                <strong>Tennis</strong><span>Explore</span>
            </a>

            <nav class="site-nav" aria-label="Main">
                <a href="/platforms">Platforms</a>
                <a href="/explore">Data</a>
                <a href="/platforms#about">About</a>
            </nav>

            <a class="button-green" href="/explore">Explore</a>
        </header>

        <main class="hero">
            <h1>Ask anything, explore everything</h1>

            <p>
                Unlock the power of our data. The central repository for insights
                that set Australia apart.
            </p>

            <div class="hero__actions">
                <a class="button-green" href="/explore">Explore our data</a>
                <a class="button-ghost" href="/platforms">Integrated platforms</a>
            </div>
        </main>

        <footer class="site-footer">
            Tennis Australia &middot; Performance Intelligence
        </footer>
    </div>
</body>
</html>
