<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explore our data — TennisExplore</title>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/site.css">
    <link rel="stylesheet" href="/styles/chat.css">
</head>
<body>
    <div class="site">
        <header class="site-header">
            <a class="brand" href="/">
                <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="11" fill="none"
                            stroke="var(--colour-green)" stroke-width="2"/>
                    <path d="M4 6c6 3 10 7 16 12" fill="none"
                          stroke="var(--colour-green)" stroke-width="2"/>
                </svg>
                <strong>Tennis</strong><span>Explore</span>
            </a>

            <nav class="site-nav" aria-label="Main">
                <a href="/platforms">Platforms</a>
                <a href="/explore" aria-current="page">Data</a>
                <a href="/platforms#about">About</a>
            </nav>

            <!--
                The role the query runs as. In a real deployment this comes off
                the authenticated session and is not selectable — a caller who
                picks their own role has every role. It is exposed here because
                the access filter is a thing worth being able to demonstrate.
            -->
            <div class="role-picker">
                <label class="visually-hidden" for="role">Query as role</label>
                <select id="role" name="role">
                    <option value="analyst" selected>Analyst</option>
                    <option value="academy_coach">Academy coach</option>
                    <option value="tour_coach">Tour coach</option>
                    <option value="strength_conditioning">S&amp;C coach</option>
                    <option value="physiotherapist">Physiotherapist</option>
                    <option value="member_services">Member services</option>
                    <option value="athlete">Athlete</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
        </header>

        <main class="workspace">
            <section class="chat-panel" aria-label="Search the data">
                <div id="conversation" class="conversation" role="log"
                     aria-live="polite" aria-relevant="additions">
                    <div class="conversation__empty">
                        <h1>Explore our data</h1>
                        <p>
                            Ask a question about the research library, match
                            records, presentations or video.
                        </p>
                    </div>
                </div>

                <div id="processing-message" class="processing-message" hidden>
                    <span class="processing-message__dot" aria-hidden="true"></span>
                    <span>Searching&hellip;</span>
                </div>

                <div id="error-banner" class="error-banner" role="alert" hidden>
                    <p id="error-message"></p>
                    <button id="dismiss-error-button" type="button"
                            class="error-banner__dismiss">Dismiss</button>
                </div>

                <form id="chat-form" class="composer">
                    <label class="visually-hidden" for="question">
                        Ask a question about the data
                    </label>

                    <textarea id="question"
                              name="question"
                              rows="1"
                              maxlength="4000"
                              placeholder="Ask a question&hellip;"
                              autocomplete="off"
                              required></textarea>

                    <button id="send-button" class="send-button" type="submit">
                        Send
                    </button>
                </form>

                <!--
                    Status lives under the composer rather than in a header
                    badge. It is only interesting while something is happening.
                -->
                <p id="processing-status" class="composer-status">
                    <span id="status-text">Ready</span>
                </p>
            </section>
        </main>
    </div>

    <!--
        Cited sources open here, beside the conversation, rather than in a new
        tab. The chat stays mounted and scrolled where it was.
    -->
    <aside id="source-panel" class="source-panel" role="complementary"
           aria-labelledby="source-panel-title" hidden>
        <header class="source-panel__header">
            <div>
                <p class="source-panel__eyebrow">Source</p>
                <h2 id="source-panel-title">Source</h2>
                <p id="source-panel-meta" class="source-panel__meta" hidden></p>
            </div>
            <button id="source-panel-close" class="source-panel__close"
                    type="button" aria-label="Close source">&times;</button>
        </header>

        <div id="source-panel-body" class="source-panel__body"></div>

        <footer class="source-panel__footer">
            <a id="source-panel-download" class="source-panel__download"
               target="_blank" rel="noopener noreferrer">Open in a new tab</a>
        </footer>
    </aside>

    <script type="module" src="/scripts/app.js"></script>
</body>
</html>
